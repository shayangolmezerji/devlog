version: 2
updates:
  # The workflow pins its actions to commit SHAs, so nothing moves them on its
  # own and a hash left alone eventually points somewhere unmaintained. These
  # PRs are how a pin gets reviewed instead of traded for a moving tag.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
