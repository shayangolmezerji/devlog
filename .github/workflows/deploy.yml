name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Default for every job: read-only access to the repository contents. The
# scopes that can publish are declared on the one job that needs them below.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Nothing beyond the default. actions/checkout needs contents: read, and the
    # Pages artifact leaves the runner over the Actions artifact service using
    # the runner-scoped token, which no GITHUB_TOKEN scope gates:
    # actions/upload-pages-artifact only tars the output and calls
    # actions/upload-artifact.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pinned to a commit rather than a moving major tag: this is third-party
      # code that runs directly on a runner checking out this repository, so a
      # tag takeover is arbitrary code execution here. The narrowed job
      # permissions above are the second layer. Dependabot opens the PRs that
      # move these hashes.
      - uses: withastro/action@3eafd002e65cc31b4f0eae0bb05450d521562247 # v6.1.3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # The only job that can publish a site. pages: write lets
    # actions/deploy-pages call the Pages deployment API, id-token: write mints
    # the OIDC token that proves the deployment came from this repository and
    # ref. Kept off `build`, which executes third-party code.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
